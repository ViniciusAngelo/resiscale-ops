apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resiscale-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/SEU_USUARIO/resiscale-ops.git'
    targetRevision: HEAD
    path: gitops
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true