apiVersion: apps/v1
kind: Deployment
metadata:
  name: resiscale-api
  labels:
    app: resiscale-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resiscale-api
  template:
    metadata:
      labels:
        app: resiscale-api
    spec:
      containers:
      - name: api
        image: ghcr.io/viniciusangelo/resiscale-ops:bf9c966ba9a2e33ff38cab57bf05b8346f1ce572
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: resiscale-api-service
spec:
  type: ClusterIP
  selector:
    app: resiscale-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000