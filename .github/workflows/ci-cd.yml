name: CI/CD Pipeline - ResiScale-Ops

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # Etapa adicional para converter o nome do repositório para minúsculas
      - name: Formatar nome do repositório para minúsculas
        id: repo_lowercase
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}

      - name: Atualizar a Tag da Imagem no Manifesto Kubernetes
        run: |
          sed -i 's|image:.*|image: ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}|g' gitops/deployment.yaml

      - name: Commitar e Enviar a Alteração de Volta ao GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci(deploy): update image tag to ${{ github.sha }} [skip ci]"
          branch: main