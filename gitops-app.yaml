apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resiscale-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/argoproj/argocd-example-apps.git' # (Depois trocaremos para o seu path local ou git)
    targetRevision: HEAD
    path: guestbook
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true